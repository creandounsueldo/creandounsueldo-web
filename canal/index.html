<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111318;color:#fff;
       font-family:'DM Sans',sans-serif;padding:24px;text-align:center}

          padding:16px 28px;border-radius:10px}
  .nota{margin-top:18px;font-size:13px;color:#6B7280}
</style>
<!-- Píxeles de anuncios: se activan solos cuando tienen ID (PIXELES más abajo) -->
</head>
<body>
<div class="caja">
  <h1>Te llevamos al <span>canal</span></h1>
  <p>Pisos con alquiler por menos de 50.000 € en toda España.<br>Salen primero en nuestro canal de WhatsApp.</p>
  <a class="boton" id="ir" href="https://chat.whatsapp.com/HUe8BCEuOhf657vbt8dfOj">Entrar al canal de WhatsApp</a>
  <div class="nota">Si no se abre solo en un segundo, pulsa el botón.</div>
</div>
<script>
(function () {
  var CANAL = 'https://chat.whatsapp.com/HUe8BCEuOhf657vbt8dfOj';
  var REGISTRO = 'https://vblyzzhixeoamcstnsqk.supabase.co/functions/v1/canal-clic';
  // IDs de los píxeles de cada plataforma (vacío = desactivado)
  var PIXELES = { meta: '', tiktok: '', google: '', x: '' };

  var q = new URLSearchParams(location.search);
  var visitante = '';
  try {
    visitante = localStorage.getItem('cus_v') || '';
    if (!visitante) { visitante = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('cus_v', visitante); }
  } catch (e) {}
  var datos = {
    fuente: q.get('utm_source') || (document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : 'directo'),
    medio: q.get('utm_medium'), campana: q.get('utm_campaign'), anuncio: q.get('utm_content'), termino: q.get('utm_term'),
    clid: q.get('fbclid') || q.get('gclid') || q.get('ttclid') || q.get('twclid'),
    referer: document.referrer || null, visitante: visitante
  };
  try {
    var cuerpo = JSON.stringify(datos);
    if (!(navigator.sendBeacon && navigator.sendBeacon(REGISTRO, new Blob([cuerpo], { type: 'text/plain' })))) {
      fetch(REGISTRO, { method: 'POST', body: cuerpo, keepalive: true, headers: { 'content-type': 'text/plain' } });
    }
  } catch (e) {}

  // Píxeles: evento de "lead" para que cada plataforma optimice hacia la gente que entra al canal
  try {
    if (PIXELES.meta) {
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', PIXELES.meta); fbq('track', 'PageView'); fbq('track', 'Lead');
    }
    if (PIXELES.tiktok) {
      !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=['page','track','identify'];
      ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};
      for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);
      ttq.load=function(e){var s=d.createElement('script');s.async=!0;s.src='https://analytics.tiktok.com/i18n/pixel/events.js?sdkid='+e+'&lib='+t;d.head.appendChild(s)};
      ttq.load(PIXELES.tiktok);ttq.page();ttq.track('Contact')}(window,document,'ttq');
    }
    if (PIXELES.google) {
      var g = document.createElement('script'); g.async = true; g.src = 'https://www.googletagmanager.com/gtag/js?id=' + PIXELES.google.split('/')[0];
      document.head.appendChild(g); window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ dataLayer.push(arguments); }; gtag('js', new Date()); gtag('config', PIXELES.google.split('/')[0]);
      if (PIXELES.google.indexOf('/') > 0) gtag('event', 'conversion', { send_to: PIXELES.google });
    }
    if (PIXELES.x) {
      !function(e,t,n,s,u,a){e.twq||(s=e.twq=function(){s.exe?s.exe.apply(s,arguments):s.queue.push(arguments)},
      s.version='1.1',s.queue=[],u=t.createElement(n),u.async=!0,u.src='https://static.ads-twitter.com/uwt.js',
      a=t.getElementsByTagName(n)[0],a.parentNode.insertBefore(u,a))}(window,document,'script');
      twq('config', PIXELES.x);
    }
  } catch (e) {}

  var espera = (PIXELES.meta || PIXELES.tiktok || PIXELES.google || PIXELES.x) ? 900 : 350;
  setTimeout(function () { location.replace(CANAL); }, espera);
})();
</script>
</body>
</html>
